<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Admin Panel — Lavanderia Molino</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'DM Sans',sans-serif;background:#0d1f3c;color:#fff;min-height:100vh;}
.login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;}
.login-box{background:#1a2f4e;border-radius:16px;padding:3rem;width:100%;max-width:400px;text-align:center;}
.login-box h1{font-size:1.5rem;margin-bottom:0.5rem;}
.login-box p{color:#94a3b8;font-size:0.9rem;margin-bottom:2rem;}
.login-box input{width:100%;padding:12px 16px;border-radius:8px;border:1px solid #2d4a6e;background:#0d1f3c;color:#fff;font-size:1rem;margin-bottom:1rem;}
.login-box button{width:100%;padding:12px;background:#0ea5e9;color:#fff;border:none;border-radius:8px;font-size:1rem;font-weight:600;cursor:pointer;}
.login-box button:hover{background:#0284c7;}
.error{color:#f87171;font-size:0.85rem;margin-top:0.5rem;}

.admin{display:none;}
.topbar{background:#1a2f4e;padding:1rem 2rem;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #2d4a6e;}
.topbar h1{font-size:1.2rem;}
.topbar button{background:#f87171;color:#fff;border:none;border-radius:6px;padding:6px 16px;cursor:pointer;font-size:0.85rem;}
.layout{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 60px);}
.sidebar{background:#1a2f4e;border-right:1px solid #2d4a6e;padding:1.5rem 0;}
.sidebar-item{padding:10px 1.5rem;cursor:pointer;font-size:0.9rem;color:#94a3b8;transition:all 0.2s;display:flex;align-items:center;gap:8px;}
.sidebar-item:hover,.sidebar-item.active{background:#0d1f3c;color:#0ea5e9;border-right:3px solid #0ea5e9;}
.main{padding:2rem;overflow-y:auto;}
.panel{display:none;}
.panel.active{display:block;}
.panel h2{font-size:1.3rem;margin-bottom:1.5rem;color:#e2e8f0;}
.field{margin-bottom:1.5rem;}
.field label{display:block;font-size:0.8rem;font-weight:600;letter-spacing:0.05em;text-transform:uppercase;color:#94a3b8;margin-bottom:6px;}
.field input,.field textarea{width:100%;padding:10px 14px;border-radius:8px;border:1px solid #2d4a6e;background:#0d1f3c;color:#fff;font-size:0.9rem;transition:border 0.2s;}
.field input:focus,.field textarea:focus{outline:none;border-color:#0ea5e9;}
.field textarea{height:80px;resize:vertical;}
.color-row{display:flex;align-items:center;gap:12px;}
.color-row input[type=color]{width:48px;height:40px;border-radius:6px;border:none;cursor:pointer;padding:2px;background:#0d1f3c;}
.color-row input[type=text]{flex:1;}
.save-btn{background:#0ea5e9;color:#fff;border:none;border-radius:8px;padding:12px 32px;font-size:0.95rem;font-weight:600;cursor:pointer;transition:background 0.2s;}
.save-btn:hover{background:#0284c7;}
.save-btn:disabled{background:#2d4a6e;cursor:not-allowed;}
.toast{position:fixed;bottom:2rem;right:2rem;background:#10b981;color:#fff;padding:12px 24px;border-radius:8px;font-weight:600;display:none;z-index:9999;}
.preview-colors{display:flex;gap:1rem;margin-top:1rem;flex-wrap:wrap;}
.preview-swatch{width:60px;height:60px;border-radius:8px;border:2px solid #2d4a6e;}
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login-screen" id="loginScreen">
  <div class="login-box">
    <h1>🔐 Admin Panel</h1>
    <p>Lavanderia Molino CMS</p>
    <input type="password" id="passInput" placeholder="Password" onkeydown="if(event.key==='Enter')login()"/>
    <button onclick="login()">Login</button>
    <div class="error" id="loginError"></div>
  </div>
</div>

<!-- ADMIN -->
<div class="admin" id="adminPanel">
  <div class="topbar">
    <h1>⚙️ Lavanderia Molino — CMS</h1>
    <button onclick="logout()">Logout</button>
  </div>
  <div class="layout">
    <div class="sidebar">
      <div class="sidebar-item active" onclick="showPanel('hero')" id="tab-hero">🏠 Hero Section</div>
      <div class="sidebar-item" onclick="showPanel('colors')" id="tab-colors">🎨 Colors</div>
      <div class="sidebar-item" onclick="showPanel('services')" id="tab-services">🫧 Services</div>
      <div class="sidebar-item" onclick="showPanel('info')" id="tab-info">📍 Info & Hours</div>
      <div class="sidebar-item" onclick="showPanel('images')" id="tab-images">🖼️ Images</div>
      <div class="sidebar-item" onclick="showPanel('prices')" id="tab-prices">💶 Prices</div>
    </div>
    <div class="main">

      <!-- HERO -->
      <div class="panel active" id="panel-hero">
        <h2>🏠 Hero Section</h2>
        <div class="field"><label>Hero Title (Blue)</label><input id="hero_title" type="text"/></div>
        <div class="field"><label>Hero Subtitle</label><input id="hero_subtitle" type="text"/></div>
        <div class="field"><label>Hero Description</label><textarea id="hero_desc"></textarea></div>
        <button class="save-btn" onclick="savePanel(['hero_title','hero_subtitle','hero_desc'])">💾 Save</button>
      </div>

      <!-- COLORS -->
      <div class="panel" id="panel-colors">
        <h2>🎨 Colors</h2>
        <div class="field"><label>Accent Color (Blue)</label><div class="color-row"><input type="color" id="accent_color_picker" oninput="document.getElementById('accent_color').value=this.value"/><input type="text" id="accent_color"/></div></div>
        <div class="field"><label>Navy Color</label><div class="color-row"><input type="color" id="navy_color_picker" oninput="document.getElementById('navy_color').value=this.value"/><input type="text" id="navy_color"/></div></div>
        <div class="field"><label>Background Color</label><div class="color-row"><input type="color" id="bg_color_picker" oninput="document.getElementById('bg_color').value=this.value"/><input type="text" id="bg_color"/></div></div>
        <div class="field"><label>Card Color</label><div class="color-row"><input type="color" id="card_color_picker" oninput="document.getElementById('card_color').value=this.value"/><input type="text" id="card_color"/></div></div>
        <button class="save-btn" onclick="savePanel(['accent_color','navy_color','bg_color','card_color'])">💾 Save</button>
      </div>

      <!-- SERVICES -->
      <div class="panel" id="panel-services">
        <h2>🫧 Services Text</h2>
        <div class="field"><label>Section Title</label><input id="services_title" type="text"/></div>
        <button class="save-btn" onclick="savePanel(['services_title'])">💾 Save</button>
      </div>

      <!-- INFO -->
      <div class="panel" id="panel-info">
        <h2>📍 Info & Hours</h2>
        <div class="field"><label>Phone</label><input id="phone" type="text"/></div>
        <div class="field"><label>Address</label><input id="address" type="text"/></div>
        <div class="field"><label>Hours</label><input id="hours" type="text"/></div>
        <button class="save-btn" onclick="savePanel(['phone','address','hours'])">💾 Save</button>
      </div>

      <!-- IMAGES -->
      <div class="panel" id="panel-images">
        <h2>🖼️ Hero Images</h2>
        <div class="field"><label>Image 1 URL</label><input id="hero_img1" type="text"/></div>
        <div class="field"><label>Image 2 URL</label><input id="hero_img2" type="text"/></div>
        <div class="field"><label>Image 3 URL</label><input id="hero_img3" type="text"/></div>
        <button class="save-btn" onclick="savePanel(['hero_img1','hero_img2','hero_img3'])">💾 Save</button>
      </div>

      <!-- PRICES -->
      <div class="panel" id="panel-prices">
        <h2>💶 Prices</h2>
        <div class="field"><label>Price S (euros)</label><input id="price_s" type="text"/></div>
        <div class="field"><label>Price M (euros)</label><input id="price_m" type="text"/></div>
        <div class="field"><label>Price L (euros)</label><input id="price_l" type="text"/></div>
        <div class="field"><label>Price XL (euros)</label><input id="price_xl" type="text"/></div>
        <div class="field"><label>Dryer (euros/10min)</label><input id="price_dryer" type="text"/></div>
        <button class="save-btn" onclick="savePanel(['price_s','price_m','price_l','price_xl','price_dryer'])">💾 Save</button>
      </div>

    </div>
  </div>
</div>

<div class="toast" id="toast">✅ Saved!</div>

<script>
const SUPABASE_URL = 'https://oibcsltumepcfuqggtlo.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9pYmNzbHR1bWVwY2Z1cWdndGxvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA5MTA3NTMsImV4cCI6MjA5NjQ4Njc1M30.lPsfiS1jHqXUDS9ROaM4R1F_V--q2lyLWdxkWxnXJXo';
const ADMIN_PASS = 'molino2025';
const TABLE = 'Laundry';

function login() {
  const pass = document.getElementById('passInput').value;
  if(pass === ADMIN_PASS) {
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('adminPanel').style.display = 'block';
    loadAll();
  } else {
    document.getElementById('loginError').textContent = 'Wrong password!';
  }
}

function logout() {
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('adminPanel').style.display = 'none';
}

function showPanel(name) {
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.sidebar-item').forEach(s => s.classList.remove('active'));
  document.getElementById('panel-' + name).classList.add('active');
  document.getElementById('tab-' + name).classList.add('active');
}

async function loadAll() {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${TABLE}?select=key,value`, {
    headers: {'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY}
  });
  const data = await res.json();
  data.forEach(row => {
    const el = document.getElementById(row.key);
    if(el) el.value = row.value || '';
    const picker = document.getElementById(row.key + '_picker');
    if(picker) picker.value = row.value || '#000000';
  });
}

async function savePanel(keys) {
  for(const key of keys) {
    const el = document.getElementById(key);
    if(!el) continue;
    const value = el.value;
    await fetch(`${SUPABASE_URL}/rest/v1/${TABLE}?key=eq.${key}`, {
      method: 'PATCH',
      headers: {
        'apikey': SUPABASE_KEY,
        'Authorization': 'Bearer ' + SUPABASE_KEY,
        'Content-Type': 'application/json',
        'Prefer': 'return=minimal'
      },
      body: JSON.stringify({value})
    });
  }
  const toast = document.getElementById('toast');
  toast.style.display = 'block';
  setTimeout(() => toast.style.display = 'none', 2500);
}
</script>
</body>
</html>
